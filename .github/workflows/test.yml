name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Neovim
        run: |
          sudo apt-get update
          sudo apt-get install --yes neovim
      - name: Run syntax tests
        run: nvim --headless -u NONE -i NONE -n -l tests/syntax.lua
